[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "py-native-io"
version = "0.1.0.dev1"
description = "Native-first cross-platform asynchronous kernel I/O for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: BSD :: FreeBSD",
    "Operating System :: BSD :: NetBSD",
    "Operating System :: BSD :: OpenBSD",
    "Operating System :: SunOS/Solaris",
    "Operating System :: POSIX",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
examples = [
    "aiofiles>=23.0.0",
]
dev = [
    "maturin>=1.5.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiofiles>=23.0.0",
]

[dependency-groups]
examples = [
    "aiofiles>=23.0.0",
]
dev = [
    "maturin>=1.5.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiofiles>=23.0.0",
]

[tool.maturin]
module-name = "py_native_io._ext"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true