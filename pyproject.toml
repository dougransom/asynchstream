[project]
name = "antigravity-agent-runtime"
version = "0.1.0"
description = "Antigravity Agent Runtime Project with Metaprogramming & Strict Compliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity>=0.2.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "C90", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/engine/*.py" = ["C901"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportUntypedBaseClass = false
reportGeneralTypeIssues = "warning"
